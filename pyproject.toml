[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosh-skills"
version = "0.1.0"
description = "Manage local skill repositories and sync skills into supported CLI tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cosh-skills = "internal.cli:main"

[tool.setuptools.packages.find]
include = ["internal*"]
