<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cosh Hammer 研发观察板</title>
    <link rel="icon" type="image/jpeg" href="/cosh-hammer-icon.jpg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div>
          <p class="eyebrow">HAMMER · CODING PLUGIN</p>
          <h1>Cosh Hammer 研发观察板</h1>
          <p id="summary">正在连接 Hammer 主流程…</p>
        </div>
        <span id="connection" class="connection">连接中</span>
      </header>
      <section id="warning" hidden></section>
      <nav class="tabs" role="tablist" aria-label="Hammer 研发阶段">
        <div class="hammer-tabs" data-tab-group="hammer" role="presentation">
          <button type="button" role="tab" data-tab="overview">总览</button>
          <button type="button" role="tab" data-tab="requirement">需求</button>
          <button type="button" role="tab" data-tab="design">设计</button>
          <button type="button" role="tab" data-tab="review">三路评审</button>
          <button type="button" role="tab" data-tab="plan">计划</button>
          <button type="button" role="tab" data-tab="validation">验证</button>
          <button type="button" role="tab" data-tab="delivery">交付</button>
          <button type="button" role="tab" data-tab="artifacts">全部产物</button>
        </div>
        <button type="button" role="tab" class="coding-tab" data-tab="coding">编码</button>
      </nav>
      <section id="viewport" class="viewport" role="tabpanel"></section>
    </main>
    <section id="artifact-viewer" class="artifact-viewer" hidden aria-label="产物内容">
      <div class="viewer-panel">
        <div class="viewer-title">
          <div>
            <p id="artifact-owner" class="eyebrow"></p>
            <h2 id="artifact-title"></h2>
          </div>
          <div class="viewer-actions">
            <div id="artifact-view-mode" class="view-mode" aria-label="产物查看方式">
              <button type="button" data-artifact-mode="rendered" class="active">阅读</button>
              <button type="button" data-artifact-mode="raw">原文</button>
            </div>
            <button type="button" id="copy-artifact">复制原文</button>
            <button type="button" id="close-artifact">关闭</button>
          </div>
        </div>
        <div id="artifact-content" class="artifact-content"></div>
      </div>
    </section>
    <script src="/artifact-formatters.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
